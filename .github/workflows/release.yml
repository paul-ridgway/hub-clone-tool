name: Release

# Publishing a GitHub release tagged vX.Y.Z publishes that version as a Go
# module. This workflow tests it, attaches prebuilt binaries to the release
# and asks the Go module proxy to index it.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3 for Go to recognise it (got $TAG)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build binaries
        env:
          CGO_ENABLED: 0
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            out="dist/hub-clone-tool_${GOOS}_${GOARCH}"
            go build -trimpath -ldflags="-s -w" -o "$out/hub-clone-tool" .
            go build -trimpath -ldflags="-s -w" -o "$out/hct" ./cmd/hct
            tar -C "$out" -czf "$out.tar.gz" hub-clone-tool hct
          done
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.tar.gz --clobber
      - name: Index on the Go module proxy
        run: curl -fsS "https://proxy.golang.org/github.com/paul-ridgway/hub-clone-tool/@v/${TAG}.info"
